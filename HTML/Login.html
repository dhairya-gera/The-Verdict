<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Verdict | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/Login.css">
</head>
<body>
    <div class="bg-layer"></div>
    <div class="noise"></div>
    <nav>
        <a href="Home.html" class="nav-logo">THE <span>VERDICT</span></a>
    </nav>
    <div class="page-wrapper">
        <div class="auth-container">
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('login')">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
                <button class="tab-btn" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </div>
            <div class="auth-card">
                <div class="panel active" id="login-panel">
                    <div class="form-heading">
                        <h2>Welcome <span class="accent">Back</span></h2>
                        <p>Login to access your personalized reviews and watchlist.</p>
                    </div>
                    <div class="alert error" id="login-error">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="login-error-msg">Invalid credentials.</span>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="you@example.com">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" placeholder="Enter password">
                        </div>
                    </div>
                    <button class="submit-btn" onclick="handleLogin()">
                        <span class="spinner"></span>
                        <span class="btn-text">Login <i class="fa-solid fa-arrow-right"></i></span>
                    </button>
                </div> 
                <div class="panel" id="register-panel">
                    <div class="reg-steps">
                        <div class="step active" id="step-1">
                            <div class="step-circle">1</div>
                            <div class="step-label">Details</div>
                            <div class="step-line"></div>
                        </div>
                        <div class="step" id="step-3">
                            <div class="step-circle">2</div>
                            <div class="step-label">Done</div>
                        </div>
                    </div>
                    <div id="reg-step-1">
                        <div class="form-heading">
                            <h2>Create <span class="accent">Account</span></h2>
                            <p>Join The Verdict and start reviewing.</p>
                        </div>
                        <div class="alert error" id="reg-error">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <span id="reg-error-msg">Please check your details.</span>
                        </div>
                        <div class="input-group">
                            <label>Full Name</label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-user"></i>
                                <input type="text" id="reg-name" placeholder="John Doe">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Email Address</label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-envelope"></i>
                                <input type="email" id="reg-email" placeholder="you@example.com">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Password</label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="reg-password" placeholder="Min 6 characters" oninput="checkStrength(this.value)">
                            </div>
                            <div class="strength-bar">
                                <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
                            </div><br>
                            <label>Confirm Password</label>
                            <div class="input-wrap">
                                <i class="fa-solid fa-lock"></i>
                                <input type="password" id="reg-password" placeholder="Min 6 characters" oninput="checkStrength(this.value)">
                            </div>
                            <div class="strength-bar">
                                <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
                            </div>
                            <div class="strength-text" id="strength-text"></div>
                        </div>
                        <button class="submit-btn" onclick="handleRegister()">
                            <span class="spinner"></span>
                            <span class="btn-text">Create Account <i class="fa-solid fa-user-plus"></i></span>
                        </button>
                    </div>
                    <div id="reg-step-3" style="display:none; text-align:center;">
                        <div style="font-size:3rem; color: var(--success); margin: 20px 0;">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="featured-title">Welcome <span id="welcome-name"></span>!</h2>
                        <p style="color: var(--text-gray); margin-bottom: 20px;">Your account is ready.</p>
                        <button class="submit-btn" onclick="switchTab('login')">Go to Login</button>
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <div class="toast" id="toast">
        <div class="toast-icon" id="toast-icon"></div>
        <div class="toast-msg" id="toast-msg"></div>
    </div>
    <script src="../JS/Login.js"></script>
</body>
</html>
