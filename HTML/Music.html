<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Music | The Verdict</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/Music.css">
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar">
            <div id="logo">
                <a href="Home.html" class="logo-link">
                    <img src="../Assets/images/logo.svg" alt="The Verdict Logo">
                </a>
            </div>

            <nav class="side-1">
                <a href="Home.html"><i class="fa-solid fa-house"></i> Movie Home</a>
                <a href="#" class="active"><i class="fa-solid fa-compass"></i> Discover Music</a>
                <a href="#"><i class="fa-solid fa-fire"></i> Trending</a>
            </nav>

            <div class="sidebar-divider"></div>

            <div class="playlists">
                <p class="playlist-header">Your Library</p>
                <a href="#"><i class="fa-solid fa-heart" style="color: #ff4b4b;"></i> Liked Songs</a>
                <a href="#"><i class="fa-solid fa-list-ul"></i> Bollywood Hits</a>
                <a href="#"><i class="fa-solid fa-list-ul"></i> Workout Mix</a>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="topbar">
                <div class="topbar-search">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Search for songs or artists..." id="searchInput">
                </div>

                <div class="topbar-user">
                    <div class="user-avatar">
                        <img src="../Assets/images/pfp.jpeg" alt="User">
                    </div>
                </div>
            </header>

            <div class="content-scroll">
                
                <section class="featured-hero">
                    <div class="featured-bg-placeholder"></div>
                    <div class="featured-content">
                        <span class="featured-tag"><i class="fa-solid fa-bolt"></i> Global Top 50</span>
                        <h1 class="featured-title">Trending Hits 2026</h1>
                        <p class="featured-desc">Listen to the most played tracks right now. Updated daily with the freshest drops from around the world.</p>
                        <div class="featured-actions">
                            <button class="btn-play-hero" onclick="playFirstTrack()">
                                <i class="fa-solid fa-play"></i> Play All
                            </button>
                        </div>
                    </div>
                </section>

                <section class="tracklist-section">
                    <h2 class="section-title">
                        <span class="accent-dash">—</span> 
                        <span id="list-heading">Recommended For You</span>
                    </h2>

                    <div class="tracklist-container" id="track-container">
                    </div>
                </section>
                
            </div>
        </main>
    </div>

    <footer class="now-playing-bar">
        
        <div class="np-track-info">
            <div class="np-thumb">
                <img src="../Assets/images/logo.svg" alt="Cover" id="player-img">
            </div>
            <div class="np-text">
                <span class="np-title" id="player-title">Verdict Music</span>
                <span class="np-artist" id="player-artist">Select a song</span>
            </div>
        </div>

        <div class="np-controls">
            <div class="np-buttons">
                <button class="ctrl-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-btn btn-play-main" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                <button class="ctrl-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="np-progress">
                <span class="np-time" id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span class="np-time" id="total-time">0:00</span>
            </div>
        </div>

        <div class="np-extras">
            <div class="np-volume">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volume-bar" value="100" min="0" max="100">
            </div>
        </div>
        
    </footer>

    <script src="../JS/Music.js"></script>

</body>
</html>
