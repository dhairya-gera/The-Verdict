<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56" role="img" aria-label="The Verdict">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- [ bracket left -->
  <rect x="0"  y="4"  width="3"  height="48" rx="1.5" fill="#38bdf8"/>
  <rect x="0"  y="4"  width="14" height="3"  rx="1.5" fill="#38bdf8"/>
  <rect x="0"  y="49" width="14" height="3"  rx="1.5" fill="#38bdf8"/>

  <!-- V monogram -->
  <polygon points="18,8 30,8 38,36 46,8 58,8 44,48 32,48" fill="url(#vg)"/>

  <!-- ] bracket right -->
  <rect x="63" y="4"  width="3"  height="48" rx="1.5" fill="#38bdf8"/>
  <rect x="53" y="4"  width="14" height="3"  rx="1.5" fill="#38bdf8"/>
  <rect x="53" y="49" width="14" height="3"  rx="1.5" fill="#38bdf8"/>

  <!-- Separator rule -->
  <rect x="76" y="4" width="1" height="48" rx="0.5" fill="rgba(255,255,255,0.1)"/>

  <!-- THE -->
  <text
    x="82" y="24"
    font-family="'Bebas Neue', 'Impact', sans-serif"
    font-size="13"
    letter-spacing="3"
    fill="#888888"
  >THE</text>

  <!-- VERDICT -->
  <text
    x="82" y="48"
    font-family="'Bebas Neue', 'Impact', sans-serif"
    font-size="28"
    letter-spacing="2"
    fill="#ffffff"
  >VERDICT</text>
</svg>
